  <script>
    (function () {
      const dialog = document.getElementById('robot-demo');
      const frame = dialog.querySelector('.robot-demo-frame');
      document.querySelectorAll('.robot-demo-button').forEach(function (button) {
        button.addEventListener('click', function () {
          document.getElementById('robot-demo-title').textContent = button.dataset.title;
          const isVideo = /\.mp4(?:[?#]|$)/i.test(button.dataset.demo);
          const media = document.createElement(isVideo ? 'video' : 'img');
          dialog.classList.toggle('robot-demo-dialog--wide', isVideo);
          dialog.style.setProperty('--demo-aspect', button.dataset.demo.includes('ur3e-hande') ? '1248 / 994' : '2 / 1');
          if (isVideo) {
            media.controls = true;
            media.muted = true;
            media.autoplay = true;
            media.loop = true;
            media.playsInline = true;
            media.preload = 'metadata';
            media.setAttribute('aria-label', button.dataset.title);
            if (button.dataset.poster) media.poster = button.dataset.poster;
          } else {
            media.alt = button.dataset.title;
          }
          media.src = button.dataset.demo;
          media.addEventListener('error', function () {
            frame.textContent = 'The demo could not load. Please close it and try again.';
          });
          frame.replaceChildren(media);
          dialog.showModal();
        });
      });
      dialog.querySelector('.robot-demo-close').addEventListener('click', function () { dialog.close(); });
      dialog.addEventListener('click', function (event) {
        if (event.target === dialog) {
          const bounds = dialog.getBoundingClientRect();
          if (event.clientX < bounds.left || event.clientX > bounds.right ||
              event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close();
        }
      });
      dialog.addEventListener('close', function () {
        const video = frame.querySelector('video');
        if (video) video.pause();
        frame.replaceChildren();
      });
      // Scale each protected source rectangle uniformly and project its markers.
      const observer = new ResizeObserver(entries => entries.forEach(entry => fitPhoto(entry.target)));
      function fitPhoto(visual) {
        const media = visual.querySelector('.robot-media');
        const img = media.querySelector('img');
        if (!img.naturalWidth || !visual.clientWidth || !visual.clientHeight) return;
        const crop = visual.closest('.robot-stage') ? (media.dataset.cardCrop || media.dataset.crop) : media.dataset.crop;
        const [x, y, width, height] = crop.split(',').map(Number);
        const scale = Math.min(visual.clientWidth / width, visual.clientHeight / height);
        media.style.width = (width * scale) + 'px';
        media.style.height = (height * scale) + 'px';
        Object.assign(img.style, {width: img.naturalWidth * scale + 'px', height: img.naturalHeight * scale + 'px', left: -x * scale + 'px', top: -y * scale + 'px'});
        media.querySelectorAll('.robot-component').forEach(button => {
          button.style.left = (Number(button.dataset.sourceX) - x) * scale + 'px';
          button.style.top = (Number(button.dataset.sourceY) - y) * scale + 'px';
        });
      }
      let activeMarker = null;
      const labels = new Map();
      let labelNumber = 0;
      function hideSpecs() {
        if (activeMarker) labels.get(activeMarker).hidden = true;
        activeMarker = null;
      }
      function showSpecs(button) {
        hideSpecs();
        const label = labels.get(button);
        activeMarker = button;
        // A tooltip inside an open dialog must share its top-layer context.
        (button.closest('dialog') || document.body).appendChild(label);
        label.hidden = false;
        const marker = button.getBoundingClientRect();
        const bounds = label.getBoundingClientRect();
        label.style.left = Math.max(12, Math.min(marker.left + marker.width / 2 - bounds.width / 2, innerWidth - bounds.width - 12)) + 'px';
        const above = marker.top - bounds.height - 10;
        label.style.top = Math.max(12, Math.min(above >= 12 ? above : marker.bottom + 10, innerHeight - bounds.height - 12)) + 'px';
      }
      function registerMarkers(visual) {
        visual.querySelectorAll('.robot-component').forEach(button => {
          const label = document.createElement('span');
          label.className = 'robot-tooltip';
          label.id = 'robot-spec-' + labelNumber++;
          label.setAttribute('role', 'tooltip');
          label.textContent = button.getAttribute('aria-label');
          label.hidden = true;
          button.querySelector('.robot-tooltip')?.remove();
          button.removeAttribute('title');
          button.setAttribute('aria-describedby', label.id);
          document.body.appendChild(label);
          labels.set(button, label);
          button.addEventListener('pointerenter', () => showSpecs(button));
          button.addEventListener('pointerleave', event => { if (event.pointerType !== 'touch' && activeMarker === button) hideSpecs(); });
          button.addEventListener('focus', () => showSpecs(button));
          button.addEventListener('blur', () => { if (activeMarker === button) hideSpecs(); });
          button.addEventListener('click', () => showSpecs(button));
        });
      }
      const photoDialog = document.getElementById('robot-photo-dialog');
      const photoStage = photoDialog.querySelector('.robot-photo-stage');
      let photoTrigger = null;
      function expandPhoto(visual, trigger) {
        hideSpecs();
        photoTrigger = trigger;
        const card = visual.closest('.robot-card');
        document.getElementById('robot-photo-title').textContent = card.querySelector('h2').textContent;
        const expanded = document.createElement('div');
        expanded.className = 'robot-visual';
        const media = visual.querySelector('.robot-media').cloneNode(true);
        const img = media.querySelector('img');
        img.removeAttribute('loading');
        img.removeAttribute('style');
        media.removeAttribute('style');
        // Keep the protected thumbnail crop when enlarging the photograph.
        const [, , cropWidth, cropHeight] = media.dataset.crop.split(',').map(Number);
        photoDialog.style.setProperty('--robot-photo-aspect', cropWidth / cropHeight);
        expanded.appendChild(media);
        photoStage.replaceChildren(expanded);
        registerMarkers(expanded);
        photoDialog.showModal();
        observer.observe(expanded);
        img.addEventListener('load', () => fitPhoto(expanded), {once: true});
        fitPhoto(expanded);
      }
      document.querySelectorAll('.robot-card .robot-visual').forEach(visual => {
        registerMarkers(visual);
        observer.observe(visual);
        const img = visual.querySelector('img');
        img.addEventListener('load', () => fitPhoto(visual));
        img.addEventListener('click', () => expandPhoto(visual, visual.querySelector('.robot-expand')));
        visual.querySelector('.robot-expand').addEventListener('click', event => expandPhoto(visual, event.currentTarget));
      });
      photoDialog.querySelector('.robot-demo-close').addEventListener('click', () => photoDialog.close());
      photoDialog.addEventListener('click', event => {
        if (event.target !== photoDialog) return;
        const b = photoDialog.getBoundingClientRect();
        if (event.clientX < b.left || event.clientX > b.right || event.clientY < b.top || event.clientY > b.bottom) photoDialog.close();
      });
      photoDialog.addEventListener('close', () => {
        hideSpecs();
        const visual = photoStage.querySelector('.robot-visual');
        if (visual) {
          observer.unobserve(visual);
          visual.querySelectorAll('.robot-component').forEach(button => { labels.get(button)?.remove(); labels.delete(button); });
        }
        photoStage.replaceChildren();
        photoTrigger?.focus({preventScroll: true});
      });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') hideSpecs(); });
      document.addEventListener('pointerdown', event => { if (!event.target.closest('.robot-component')) hideSpecs(); });
      function repositionSpecs() { if (activeMarker) showSpecs(activeMarker); }
      window.addEventListener('resize', repositionSpecs);
      window.addEventListener('scroll', repositionSpecs, true);
    })();
  </script>

<script>
(() => {
  const cards = [...document.querySelectorAll('.robot-card')];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = reduceMotion.matches;
  const pauseAll = document.querySelector('.robot-pause-all');
  const refresh = () => {
    pauseAll.innerHTML = `<i class="fas fa-${paused ? 'play' : 'pause'}" aria-hidden="true"></i> ${paused ? 'Play' : 'Pause'} Demos`;
    cards.forEach(card => {
      const video = card.querySelector('.robot-inline-demo');
      const shouldPlay = !paused && card.dataset.inView !== 'false' && card.querySelector('.robot-stage').dataset.view === 'demo' && card.dataset.paused !== 'true' && !document.hidden && !document.querySelector('dialog[open]');
      if (shouldPlay) video.play().catch(() => {}); else video.pause();
      const localPause = card.querySelector('.robot-inline-pause');
      localPause.innerHTML = `<i class="fas fa-${shouldPlay ? 'pause' : 'play'}" aria-hidden="true"></i>`;
      localPause.setAttribute('aria-label', `${shouldPlay ? 'Pause' : 'Play'} ${card.querySelector('h2').textContent} demonstration`);
    });
  };
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => { entry.target.dataset.inView = String(entry.isIntersecting); });
    refresh();
  }, {threshold: .15});
  cards.forEach(card => {
    const stage = card.querySelector('.robot-stage');
    observer.observe(card);
    card.querySelectorAll('[data-view]').forEach(button => {
      if (button.tagName !== 'BUTTON') return;
      button.addEventListener('click', () => {
        stage.dataset.view = button.dataset.view;
        card.querySelectorAll('.robot-view-switch button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
        refresh();
      });
    });
    card.querySelector('.robot-inline-expand').addEventListener('click', () => {card.querySelector('.robot-demo-button').click(); refresh();});
    card.querySelector('.robot-inline-pause').addEventListener('click', () => {
      card.dataset.paused = String(!card.querySelector('.robot-inline-demo').paused);
      if (paused) { paused = false; cards.forEach(c => c.dataset.paused = String(c !== card)); }
      refresh();
    });
  });
  pauseAll.addEventListener('click', () => {paused = !paused; cards.forEach(card => card.dataset.paused = 'false'); refresh();});
  document.addEventListener('visibilitychange', refresh);
  document.querySelectorAll('dialog').forEach(dialog => {
    dialog.addEventListener('close', refresh);
    new MutationObserver(refresh).observe(dialog, {attributes:true, attributeFilter:['open']});
  });
  reduceMotion.addEventListener('change', e => {paused = e.matches; refresh();});
  refresh();
})();
</script>
</body>
